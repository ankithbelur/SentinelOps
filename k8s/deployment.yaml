apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinelops
  template:
    metadata:
      labels:
        app: sentinelops
    spec:
      containers:
        - name: sentinelops
          image: sentinelops:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sentinelops-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
