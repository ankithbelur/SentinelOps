---
- name: Create SentinelOps deployment directory
  file:
    path: "{{ app_directory }}"
    state: directory
    mode: '0755'

- name: Display deployment configuration
  debug:
    msg: "SentinelOps deployment directory configured at {{ app_directory }}"

- name: Deploy application configuration from template
  template:
    src: application.properties.j2
    dest: "{{ app_directory }}/application.properties"
    mode: '0644'
  notify: Validate SentinelOps deployment

- name: Deploy SentinelOps application JAR
  copy:
    src: "{{ playbook_dir }}/../target/sentinelops-1.0.0.jar"
    dest: "{{ app_directory }}/sentinelops.jar"
    mode: '0644'
  notify: Validate SentinelOps deployment

  