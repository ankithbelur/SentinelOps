- name: Ensure Java 17 runtime is available
  ansible.builtin.command: java -version
  changed_when: false
- name: Create application directory
  ansible.builtin.file:
    path: /tmp/sentinelops
    state: directory
    mode: '0755'
- name: Copy application artifact (build it locally first)
  ansible.builtin.copy:
    src: ../../../target/sentinelops-1.0.0.jar
    dest: /tmp/sentinelops/sentinelops.jar
    mode: '0644'
  notify: Restart SentinelOps (placeholder handler)
